<script>
'use strict';
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const icon=(name,cls='')=>`<svg class="icon ${cls}" aria-hidden="true"><use href="#i-${name}"/></svg>`;
const escapeHtml=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0'), dateKey=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const atMidnight=d=>new Date(d.getFullYear(),d.getMonth(),d.getDate());
const addDays=(d,n)=>new Date(d.getFullYear(),d.getMonth(),d.getDate()+n,d.getHours(),d.getMinutes(),d.getSeconds(),d.getMilliseconds());
const timeText=d=>`${pad(d.getHours())}:${pad(d.getMinutes())}`;
const monthNames=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const dayNames=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const categories=['Work','Personal','Health','Shopping','None'];
const categoryIcon=c=>({Work:'work',Personal:'personal',Health:'health',Shopping:'shopping',None:'notify'}[c]||'notify');
const catClass=c=>'cat-'+c.toLowerCase();
const launchedAt=new Date();
let reminders=[
{id:1,title:'Drink a glass of water',category:'Health',kind:'daily',time:'11:00',early:0},
{id:2,title:'Team call',category:'Work',kind:'weekly',weekdays:[1,3,5],time:'10:30',early:0},
{id:3,title:'Lunch break',category:'Personal',kind:'weekly',weekdays:[1,2,3,4,5],time:'13:00',early:0},
{id:4,title:'Evening walk',category:'Health',kind:'daily',time:'20:00',early:0},
{id:5,title:'Buy groceries',category:'Shopping',kind:'weekly',weekdays:[6],time:'18:00',early:0},
{id:6,title:'Pay the bills',category:'Personal',kind:'monthly',day:10,time:'09:00',early:0},
{id:7,title:'Renew the website domain',category:'Work',kind:'yearly',month:3,day:1,time:'09:00',early:0},
{id:8,title:"Anna's birthday",category:'Personal',kind:'yearly',month:6,day:16,time:'09:00',early:7},
{id:9,title:'Dentist appointment',category:'Health',kind:'once',date:dateKey(addDays(launchedAt,5)),time:'15:30',early:0}
];
const titleHistory=new Set(reminders.map(r=>r.title));
let nextId=10, handled=new Set(), doneLog=[], snoozes=new Map(), currentTab='upcoming', pausedUntil=0, activeReminder=null, editingId=null, deleteId=null, formState={}, returnFocus=null, toastTimer, suggestionIndex=-1, lastTick=launchedAt;
function lastDay(y,m){return new Date(y,m+1,0).getDate()}
function eventMatches(r,d){
 if(r.kind==='once')return dateKey(d)===r.date;
 if(r.kind==='daily')return true;
 if(r.kind==='weekly')return (r.weekdays||[]).includes(d.getDay());
 if(r.kind==='monthly')return d.getDate()===Math.min(r.day,lastDay(d.getFullYear(),d.getMonth()));
 return d.getMonth()===r.month-1&&d.getDate()===Math.min(r.day,lastDay(d.getFullYear(),d.getMonth()));
}
function occurrences(r,from,days=402){
 const result=[],start=addDays(atMidnight(from),-1),[h,m]=r.time.split(':').map(Number);
 for(let i=0;i<days+9;i++){
  const d=addDays(start,i);if(!eventMatches(r,d))continue;
  const event=new Date(d.getFullYear(),d.getMonth(),d.getDate(),h,m);
  for(const offset of r.early?[0,r.early]:[0]){
   const due=addDays(event,-offset),key=`${r.id}:${dateKey(event)}:${r.time}:${offset}`;
   result.push({r,due,event,key,isEarly:offset>0});
  }
 }
 return result.sort((a,b)=>a.due-b.due);
}
function nextFor(r,now=new Date()){
 const regular=occurrences(r,now).find(o=>o.due>=now&&!handled.has(o.key));
 const snoozed=snoozes.get(r.id);
 return snoozed&&(!regular||snoozed.due<regular.due)?snoozed:regular;
}
function upcoming(now=new Date()){return reminders.map(r=>nextFor(r,now)).filter(Boolean).sort((a,b)=>a.due-b.due||a.r.id-b.r.id)}
function ruleText(r,withTime=true){
 let text='';
 if(r.kind==='daily')text='Daily';
 else if(r.kind==='weekly'){
  const days=[...(r.weekdays||[])].sort((a,b)=>(a||7)-(b||7));
  if(days.join(',')==='1,2,3,4,5')text='Weekdays';
  else if(days.length===7)text='Daily';
  else text=days.map(d=>dayNames[d]).join(', ');
 }else if(r.kind==='monthly')text=`Every month on the ${ordinal(r.day)}`;
 else if(r.kind==='yearly')text=`${monthNames[r.month-1]} ${r.day} every year`;
 else{const d=new Date(r.date+'T12:00:00');text=`${monthNames[d.getMonth()]} ${d.getDate()}, ${d.getFullYear()}`}
 return withTime?`${text} at ${r.time}`:text;
}
function ordinal(n){return n+([11,12,13].includes(n%100)?'th':({1:'st',2:'nd',3:'rd'}[n%10]||'th'))}
function relative(d,now=new Date()){
 const mins=Math.max(0,Math.ceil((d-now)/60000));
 if(dateKey(d)===dateKey(now))return mins<60?`in ${mins} min`:`in ${Math.floor(mins/60)} h${mins%60?' '+mins%60+' min':''}`;
 if(d<addDays(atMidnight(now),7))return `${dayNames[d.getDay()]} ${timeText(d)}`;
 return `${monthNames[d.getMonth()]} ${d.getDate()}`;
}
function shortRelative(d,now){const s=relative(d,now);return s.replace(/(in \d+ h) \d+ min/,'$1')}
function previewDate(d){return `${dayNames[d.getDay()]}, ${monthNames[d.getMonth()]} ${d.getDate()} at ${timeText(d)}`}
function recordDone(o,shownAt=new Date()){
 handled.add(o.key);if(snoozes.get(o.r.id)?.key===o.key)snoozes.delete(o.r.id);
 if(!doneLog.some(x=>x.key===o.key))doneLog.push({...o,shownAt});
}
for(const r of reminders)for(const o of occurrences(r,launchedAt,1))if(dateKey(o.due)===dateKey(launchedAt)&&o.due<launchedAt)recordDone(o,o.due);
function render(){
 const now=new Date(),items=upcoming(now),done=doneLog.filter(o=>dateKey(o.shownAt)===dateKey(now)).sort((a,b)=>b.shownAt-a.shownAt);
 $('#upcoming-count').textContent=items.length;$('#done-count').textContent=done.length;
 const n=items[0];
 $('#next-up').innerHTML=n?`<p class="eyebrow">Next up${n.isEarly?' · Early reminder':''}</p><h2 class="next-title" title="${escapeHtml(n.r.title)}">${escapeHtml(n.r.title)}</h2><div class="next-meta"><span class="countdown">${icon('clock')}<span>${relative(n.due,now)}</span></span><span class="next-schedule">${timeText(n.due)} &nbsp; ${escapeHtml(n.key.includes('snooze')?'Snoozed':ruleText(n.r,false))}</span></div>`:`<p class="eyebrow">Next up</p><h2 class="next-title">A little room to breathe</h2><div class="next-meta">${reminders.length?'All reminders are complete.':'Your next reminder will appear here.'}</div>`;
 const scroll=$('#reminder-list').scrollTop;
 if(currentTab==='done'){
  $('#reminder-list').innerHTML=done.length?`<h2 class="section-label">Today<span>Time shown</span></h2>`+done.map(o=>`<article class="reminder-row row-done"><span class="category-icon ${catClass(o.r.category)}">${icon(categoryIcon(o.r.category))}</span><div class="row-copy"><h3 class="row-title" style="margin:0" title="${escapeHtml(o.r.title)}">${escapeHtml(o.r.title)}</h3><p class="row-meta">${o.isEarly?'Early reminder shown':'Reminder shown'}</p></div><div class="done-time">${icon('check')}<br>${timeText(o.shownAt)}</div></article>`).join(''):`<div class="empty-state">${icon('check')}<p>Reminders you’ve seen today will appear here.</p></div>`;
 }else if(!items.length){
  $('#reminder-list').innerHTML=`<div class="empty-state">${icon('notify')}<p>Add a reminder for something that matters.</p><button class="btn secondary" data-action="new">${icon('plus')}New reminder</button></div>`;
 }else{
  const groups=[['Today',[]],['Tomorrow',[]],['This week',[]],['Later',[]]],tomorrow=dateKey(addDays(now,1)),weekEnd=addDays(atMidnight(now),7-((now.getDay()+6)%7));
  for(const o of items){const key=dateKey(o.due),g=key===dateKey(now)?0:key===tomorrow?1:o.due<weekEnd?2:3;groups[g][1].push(o)}
  $('#reminder-list').innerHTML=groups.map(([label,rows],i)=>`<section aria-label="${label}"><h2 class="section-label">${label}</h2>${rows.length?rows.map(o=>rowHtml(o,now)).join(''):`<p class="quiet-empty">${['All set for today','Nothing scheduled tomorrow','Nothing else this week','Nothing scheduled later'][i]}</p>`}</section>`).join('');
 }
 $('#reminder-list').scrollTop=scroll;
 $('#pause-toggle').checked=pausedUntil>now;
 $('#pause-copy').textContent=pausedUntil>now?`Paused until ${timeText(new Date(pausedUntil))}`:'Pause reminders';
 $('#desktop-clock').innerHTML=`${timeText(now)}<br>${pad(now.getDate())}/${pad(now.getMonth()+1)}/${now.getFullYear()}`;
}
function rowHtml(o,now){return `<article class="reminder-row"><span class="category-icon ${catClass(o.r.category)}" title="${escapeHtml(o.r.category)}">${icon(categoryIcon(o.r.category))}</span><div class="row-copy"><h3 class="row-title" style="margin:0" title="${escapeHtml(o.r.title)}">${escapeHtml(o.r.title)}</h3><p class="row-meta" title="${escapeHtml(ruleText(o.r))}">${escapeHtml(o.key.includes('snooze')?'Snoozed until '+timeText(o.due):o.isEarly?'1 week'===earlyText(o.r.early)?'1 week before '+monthNames[o.event.getMonth()]+' '+o.event.getDate():earlyText(o.r.early)+' before '+monthNames[o.event.getMonth()]+' '+o.event.getDate():ruleText(o.r))}</p></div><span class="relative">${shortRelative(o.due,now)}</span><div class="row-actions"><button class="icon-button" data-action="edit" data-id="${o.r.id}" aria-label="Edit ${escapeHtml(o.r.title)}" title="Edit">${icon('edit')}</button><button class="icon-button" data-action="delete" data-id="${o.r.id}" aria-label="Delete ${escapeHtml(o.r.title)}" title="Delete">${icon('delete')}</button></div></article>`}
function earlyText(n){return n===7?'1 week':`${n} ${n===1?'day':'days'}`}
function setTab(tab){currentTab=tab;for(const b of $$('.tab')){const active=b.id===`tab-${tab}`;b.setAttribute('aria-selected',active);b.tabIndex=active?0:-1}$('#reminder-list').setAttribute('aria-labelledby',`tab-${tab}`);$('#reminder-list').scrollTop=0;render()}
function setScreen(name){$$('[data-screen]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.screen===name))}
function showReminders(){closeEditor(false);closeDelete(false);if(!$('#fullscreen').hidden)dismissFullscreen(false);$('#flyout').hidden=false;$('#tray-launch').setAttribute('aria-expanded','true');setScreen('reminders');render()}
function notify(message){clearTimeout(toastTimer);$('#toast span').textContent=message;$('#toast').hidden=false;toastTimer=setTimeout(()=>$('#toast').hidden=true,3200)}
function setTheme(light){document.body.classList.toggle('light',light);$('#theme-icon use').setAttribute('href',light?'#i-sun':'#i-moon');$('#theme-toggle').setAttribute('aria-label',`Switch to ${light?'dark':'light'} theme`);$$('[data-theme]').forEach(b=>{const active=(b.dataset.theme==='light')===light;b.setAttribute('aria-checked',active);b.tabIndex=active?0:-1})}
function selectRadio(group,attr,value){$$(group+' [role=radio]').forEach(b=>{const active=b.dataset[attr]===String(value);b.setAttribute('aria-checked',active);b.tabIndex=active?0:-1})}
function openEditor(id=null){
 if(!$('#fullscreen').hidden)dismissFullscreen(false);closeDelete(false);returnFocus=document.activeElement;editingId=id;
 const now=new Date(),soon=new Date(Math.ceil((now.getTime()+30*60000)/(15*60000))*(15*60000));
 const r=reminders.find(r=>r.id===id);formState=r?{...r,weekdays:[...(r.weekdays||[now.getDay()])]}:{kind:'once',category:'None',time:timeText(soon),date:dateKey(soon),weekdays:[now.getDay()],day:now.getDate(),month:now.getMonth()+1,early:0};
 formState.date||=dateKey(soon);formState.day||=now.getDate();formState.month||=now.getMonth()+1;
 $('#editor-heading').textContent=id?'Edit reminder':'New reminder';$('#title-input').value=r?.title||'';$('#time-input').value=formState.time;$('#title-error').hidden=true;$('#form-error').hidden=true;$('#title-input').classList.remove('invalid');$('#title-input').setAttribute('aria-invalid','false');hideSuggestions();
 $('#category-control').innerHTML=categories.map(c=>`<button type="button" role="radio" data-category="${c}" aria-checked="${c===formState.category}" tabindex="${c===formState.category?0:-1}" class="category-chip">${c==='None'?'':icon(categoryIcon(c))}${c}</button>`).join('');
 selectRadio('#repeat-control','repeat',formState.kind);selectRadio('#early-control','early',formState.early);renderRepeatFields();updatePreview();$('#editor-layer').hidden=false;setScreen('new');requestAnimationFrame(()=>$('#title-input').focus());
}
function renderRepeatFields(){
 const r=formState;let html='';
 if(r.kind==='once')html=`<label class="sr-only" for="date-input">Date</label><input class="field" id="date-input" type="date" value="${r.date}" required>`;
 if(r.kind==='weekly')html=`<div class="weekdays" role="group" aria-label="Weekdays">${[1,2,3,4,5,6,0].map(d=>`<button type="button" class="day-chip" data-day="${d}" aria-label="${['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'][d]}" aria-pressed="${r.weekdays.includes(d)}">${dayNames[d]}</button>`).join('')}</div>`;
 if(r.kind==='monthly')html=`<div class="inline-fields"><label for="day-input">Day of month</label><input class="field day-number" type="number" id="day-input" min="1" max="31" value="${r.day}"></div><p class="field-note">On shorter months: last day</p>`;
 if(r.kind==='yearly')html=`<div class="inline-fields"><label class="sr-only" for="month-input">Month</label><select class="field" id="month-input">${monthNames.map((m,i)=>`<option value="${i+1}" ${i+1===r.month?'selected':''}>${m}</option>`).join('')}</select><label class="sr-only" for="day-input">Day</label><input class="field day-number" type="number" id="day-input" min="1" max="${lastDay(2000,r.month-1)}" value="${r.day}"></div><p class="field-note" id="year-note" ${r.month===2&&r.day===29?'':'hidden'}>In other years: Feb 28</p>`;
 $('#repeat-fields').innerHTML=html;
}
function collectForm(){
 formState.time=$('#time-input').value;
 if($('#date-input'))formState.date=$('#date-input').value;
 if($('#day-input'))formState.day=Number($('#day-input').value);
 if($('#month-input'))formState.month=Number($('#month-input').value);
 return {...formState,id:editingId||nextId,title:$('#title-input').value.trim()};
}
function formValid(r){return r.time&&/^\d{2}:\d{2}$/.test(r.time)&&(r.kind!=='once'||/^\d{4}-\d{2}-\d{2}$/.test(r.date||''))&&(r.kind!=='weekly'||r.weekdays.length)&&(r.kind!=='monthly'||r.day>=1&&r.day<=31)&&(r.kind!=='yearly'||r.day>=1&&r.day<=lastDay(2000,r.month-1))}
function updatePreview(){const r=collectForm(),valid=formValid(r),o=valid?nextFor({...r,id:-1}):null;$('#live-preview span').textContent=o?`Next: ${previewDate(o.due)}${o.isEarly?' (early reminder)':''}`:r.kind==='weekly'&&!r.weekdays.length?'Choose at least one weekday.':'Choose a future date and a valid time.'}
function closeEditor(focus=true){const wasOpen=!$('#editor-layer').hidden;$('#editor-layer').hidden=true;hideSuggestions();if(wasOpen){setScreen('reminders');if(focus){if(returnFocus?.isConnected)returnFocus.focus();else $('#new-button').focus()}}}
function hideSuggestions(){$('#title-suggestions').hidden=true;$('#title-input').setAttribute('aria-expanded','false');$('#title-input').removeAttribute('aria-activedescendant');suggestionIndex=-1}
function showSuggestions(){const q=$('#title-input').value.toLowerCase().trim(),matches=[...titleHistory].filter(t=>q&&t.toLowerCase().includes(q)&&t.toLowerCase()!==q).slice(0,5);if(!matches.length){hideSuggestions();return}$('#title-suggestions').innerHTML=matches.map((t,i)=>`<div class="suggestion" role="option" aria-selected="false" id="suggestion-${i}" data-title="${escapeHtml(t)}">${icon('clock')}${escapeHtml(t)}</div>`).join('');$('#title-suggestions').hidden=false;$('#title-input').setAttribute('aria-expanded','true');suggestionIndex=-1}
function chooseSuggestion(el){$('#title-input').value=el.dataset.title;hideSuggestions();$('#title-input').focus();$('#title-error').hidden=true;$('#title-input').classList.remove('invalid');$('#title-input').setAttribute('aria-invalid','false');updatePreview()}
function openDelete(id){returnFocus=document.activeElement;deleteId=id;const r=reminders.find(r=>r.id===id);$('#delete-copy').textContent=`“${r.title}” will be removed from your reminders.`;$('#delete-layer').hidden=false;$('#cancel-delete').focus()}
function closeDelete(focus=true){const open=!$('#delete-layer').hidden;$('#delete-layer').hidden=true;deleteId=null;if(open&&focus){if(returnFocus?.isConnected)returnFocus.focus();else $('#new-button').focus()}}
function openFullscreen(o=upcoming()[0]){
 if(!o){notify('Add a reminder to preview it.');return}closeEditor(false);closeDelete(false);$('#settings-popover').hidden=true;$('#settings-button').setAttribute('aria-expanded','false');returnFocus=document.activeElement;activeReminder=o;
 $('#fullscreen-category').className='category-icon '+catClass(o.r.category);$('#fullscreen-category').innerHTML=icon(categoryIcon(o.r.category));$('#fullscreen-title').textContent=o.r.title;$('#fullscreen-eyebrow').textContent=o.isEarly?`${earlyText(o.r.early)} before ${monthNames[o.event.getMonth()]} ${o.event.getDate()}`:o.r.category==='Work'?'A moment to focus':'A moment for you';$('#fullscreen-time').textContent=`Scheduled for ${previewDate(o.due)}`;
 $('#snooze-menu').hidden=true;$('#snooze-button').setAttribute('aria-expanded','false');$('#fullscreen').hidden=false;setScreen('fullscreen');$('#done-button').focus();
}
function dismissFullscreen(complete=true){
 if($('#fullscreen').hidden)return;
 if(complete&&activeReminder)recordDone(activeReminder);
 $('#fullscreen').hidden=true;$('#snooze-menu').hidden=true;$('#snooze-button').setAttribute('aria-expanded','false');activeReminder=null;setScreen('reminders');$('#flyout').hidden=false;$('#tray-launch').setAttribute('aria-expanded','true');render();if(returnFocus?.isConnected)returnFocus.focus();else $('#new-button').focus();
}
function snooze(minutes){if(!activeReminder)return;const o=activeReminder,now=new Date();recordDone(o,now);snoozes.set(o.r.id,{...o,due:new Date(now.getTime()+minutes*60000),key:`${o.r.id}:snooze:${now.getTime()}`,isEarly:false});dismissFullscreen(false);notify(`Snoozed for ${minutes===60?'1 hour':minutes+' min'}`)}
function tick(){
 const now=new Date();if(pausedUntil&&pausedUntil<=now)pausedUntil=0;
 const due=reminders.flatMap(r=>occurrences(r,lastTick,Math.min(402,Math.ceil((now-lastTick)/86400000)+1))).filter(o=>o.due>lastTick&&o.due<=now&&!handled.has(o.key));
 for(const o of snoozes.values())if(o.due<=now&&!handled.has(o.key))due.push(o);
 due.sort((a,b)=>a.due-b.due);pendingDue.push(...due.filter(o=>!pendingDue.some(x=>x.key===o.key)));lastTick=now;
 if(!pausedUntil&&$('#fullscreen').hidden&&$('#editor-layer').hidden&&$('#delete-layer').hidden&&pendingDue.length){const o=pendingDue.shift();if(reminders.some(r=>r.id===o.r.id)&&!handled.has(o.key))openFullscreen(o)}
 render();
}
let pendingDue=[];
$('#new-button').addEventListener('click',()=>openEditor());$('#desktop-launch').addEventListener('click',showReminders);$('#taskbar-launch').addEventListener('click',showReminders);
$('#tray-launch').addEventListener('click',()=>{if(!$('#editor-layer').hidden||!$('#fullscreen').hidden){showReminders();return}$('#flyout').hidden=!$('#flyout').hidden;$('#tray-launch').setAttribute('aria-expanded',!$('#flyout').hidden)});
$$('[data-screen]').forEach(b=>b.addEventListener('click',()=>{if(b.dataset.screen==='new')openEditor();else if(b.dataset.screen==='fullscreen')openFullscreen();else showReminders()}));
$('#theme-toggle').addEventListener('click',()=>setTheme(!document.body.classList.contains('light')));$$('[data-theme]').forEach(b=>b.addEventListener('click',()=>setTheme(b.dataset.theme==='light')));
$('#tab-upcoming').addEventListener('click',()=>setTab('upcoming'));$('#tab-done').addEventListener('click',()=>setTab('done'));
$('.tabs').addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight','Home','End'].includes(e.key)){e.preventDefault();setTab(e.key==='Home'?'upcoming':e.key==='End'?'done':currentTab==='upcoming'?'done':'upcoming');$(`[aria-selected="true"].tab`).focus()}});
$('#reminder-list').addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b)return;if(b.dataset.action==='new')openEditor();else if(b.dataset.action==='edit')openEditor(Number(b.dataset.id));else openDelete(Number(b.dataset.id))});
$('#pause-toggle').addEventListener('change',e=>{pausedUntil=e.target.checked?Date.now()+3600000:0;render();notify(e.target.checked?'Reminders paused for 1 hour':'Reminders resumed');if(!pausedUntil)tick()});
$('#settings-button').addEventListener('click',()=>{const p=$('#settings-popover');p.hidden=!p.hidden;$('#settings-button').setAttribute('aria-expanded',!p.hidden);if(!p.hidden)p.querySelector('[aria-checked=true]').focus()});$('#settings-preview').addEventListener('click',()=>openFullscreen());
$$('[data-close-editor]').forEach(b=>b.addEventListener('click',()=>closeEditor()));
$('#repeat-control').addEventListener('click',e=>{const b=e.target.closest('[data-repeat]');if(!b)return;collectForm();formState.kind=b.dataset.repeat;selectRadio('#repeat-control','repeat',formState.kind);renderRepeatFields();updatePreview()});
$('#category-control').addEventListener('click',e=>{const b=e.target.closest('[data-category]');if(!b)return;formState.category=b.dataset.category;selectRadio('#category-control','category',formState.category);updatePreview()});
$('#early-control').addEventListener('click',e=>{const b=e.target.closest('[data-early]');if(!b)return;formState.early=Number(b.dataset.early);selectRadio('#early-control','early',formState.early);updatePreview()});
$('#repeat-fields').addEventListener('click',e=>{const b=e.target.closest('[data-day]');if(!b)return;const d=Number(b.dataset.day);formState.weekdays=formState.weekdays.includes(d)?formState.weekdays.filter(x=>x!==d):[...formState.weekdays,d];b.setAttribute('aria-pressed',formState.weekdays.includes(d));updatePreview()});
$('#repeat-fields').addEventListener('input',()=>{collectForm();if($('#month-input')){const max=lastDay(2000,formState.month-1);$('#day-input').max=max;if(formState.day>max){formState.day=max;$('#day-input').value=max}$('#year-note').hidden=!(formState.month===2&&formState.day===29)}updatePreview()});$('#time-input').addEventListener('input',updatePreview);
$('#title-input').addEventListener('input',()=>{showSuggestions();if($('#title-input').value.trim()){$('#title-error').hidden=true;$('#title-input').classList.remove('invalid');$('#title-input').setAttribute('aria-invalid','false')}updatePreview()});
$('#title-input').addEventListener('keydown',e=>{if($('#title-suggestions').hidden)return;const options=$$('#title-suggestions [role=option]');if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();suggestionIndex=(suggestionIndex+(e.key==='ArrowDown'?1:options.length-1)+options.length)%options.length;options.forEach((o,i)=>o.setAttribute('aria-selected',i===suggestionIndex));$('#title-input').setAttribute('aria-activedescendant',options[suggestionIndex].id)}else if(e.key==='Enter'&&suggestionIndex>=0){e.preventDefault();chooseSuggestion(options[suggestionIndex])}else if(e.key==='Escape'){e.preventDefault();e.stopPropagation();hideSuggestions()}});
$('#title-suggestions').addEventListener('mousedown',e=>e.preventDefault());$('#title-suggestions').addEventListener('click',e=>{const o=e.target.closest('[data-title]');if(o)chooseSuggestion(o)});
$('#reminder-form').addEventListener('submit',e=>{
 e.preventDefault();const r=collectForm();hideSuggestions();
 if(!r.title){$('#title-error').hidden=false;$('#title-input').classList.add('invalid');$('#title-input').setAttribute('aria-invalid','true');$('#title-input').focus();return}
 const o=formValid(r)?nextFor({...r,id:-1}):null;
 if(!o){$('#form-error').hidden=false;$('#form-error').textContent=r.kind==='weekly'&&!r.weekdays.length?'Choose at least one weekday.':'Choose a future date and a valid time.';return}
 if(editingId){reminders=reminders.map(x=>x.id===editingId?r:x);snoozes.delete(editingId);pendingDue=pendingDue.filter(o=>o.r.id!==editingId);handled=new Set([...handled].filter(k=>!k.startsWith(editingId+':')))}else{reminders.push(r);nextId++}
 titleHistory.add(r.title);closeEditor(false);showReminders();setTab('upcoming');$('#new-button').focus();notify(editingId?'Reminder saved':'Reminder added');
});
$('#cancel-delete').addEventListener('click',()=>closeDelete());$('#confirm-delete').addEventListener('click',()=>{const id=deleteId;reminders=reminders.filter(r=>r.id!==id);doneLog=doneLog.filter(o=>o.r.id!==id);snoozes.delete(id);pendingDue=pendingDue.filter(o=>o.r.id!==id);closeDelete(false);render();$('#new-button').focus();notify('Reminder deleted')});
$('#done-button').addEventListener('click',()=>dismissFullscreen());$('#fullscreen').addEventListener('click',e=>{if(!e.target.closest('.fullscreen-actions'))dismissFullscreen()});$('#snooze-button').addEventListener('click',()=>{const m=$('#snooze-menu');m.hidden=!m.hidden;$('#snooze-button').setAttribute('aria-expanded',!m.hidden);if(!m.hidden)m.querySelector('button').focus()});$$('[data-snooze]').forEach(b=>b.addEventListener('click',()=>snooze(Number(b.dataset.snooze))));
$('#snooze-menu').addEventListener('keydown',e=>{const a=$$('#snooze-menu button'),i=a.indexOf(document.activeElement);if(['ArrowDown','ArrowUp','Home','End'].includes(e.key)){e.preventDefault();a[e.key==='Home'?0:e.key==='End'?a.length-1:(i+(e.key==='ArrowDown'?1:a.length-1))%a.length].focus()}});
document.addEventListener('click',e=>{if(!e.target.closest('#settings-popover,#settings-button')){$('#settings-popover').hidden=true;$('#settings-button').setAttribute('aria-expanded','false')}if(!e.target.closest('#title-input,#title-suggestions'))hideSuggestions()});
document.addEventListener('keydown',e=>{
 if(e.key==='Escape'){
  if(!$('#delete-layer').hidden){e.preventDefault();closeDelete()}
  else if(!$('#editor-layer').hidden){e.preventDefault();closeEditor()}
  else if(!$('#fullscreen').hidden){e.preventDefault();if(!$('#snooze-menu').hidden){$('#snooze-menu').hidden=true;$('#snooze-button').setAttribute('aria-expanded','false');$('#snooze-button').focus()}else dismissFullscreen()}
  else if(!$('#settings-popover').hidden){$('#settings-popover').hidden=true;$('#settings-button').setAttribute('aria-expanded','false');$('#settings-button').focus()}
  return;
 }
 const group=e.target.closest('[role=radiogroup]');if(group&&['ArrowLeft','ArrowRight','ArrowDown','ArrowUp','Home','End'].includes(e.key)){e.preventDefault();const b=[...group.querySelectorAll('[role=radio]')],i=b.indexOf(document.activeElement),n=e.key==='Home'?0:e.key==='End'?b.length-1:(i+(['ArrowRight','ArrowDown'].includes(e.key)?1:b.length-1))%b.length;b[n].click();b[n].focus()}
 if(e.key==='Tab'){
  const active=!$('#delete-layer').hidden?$('#delete-layer'):!$('#editor-layer').hidden?$('#editor-layer'):!$('#fullscreen').hidden?$('#fullscreen'):null;
  if(active){const focusable=[...active.querySelectorAll('button,input,select,[tabindex="0"]')].filter(x=>!x.disabled&&x.getClientRects().length&&x.tabIndex>=0),first=focusable[0],last=focusable.at(-1);if(e.shiftKey&&(document.activeElement===first||!active.contains(document.activeElement))){e.preventDefault();last.focus()}else if(!e.shiftKey&&(document.activeElement===last||!active.contains(document.activeElement))){e.preventDefault();first.focus()}}
 }
});
render();setTheme(false);
setTimeout(()=>{tick();setInterval(tick,60000)},60000-Date.now()%60000);
</script>
</body>
