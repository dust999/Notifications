<svg class="defs" aria-hidden="true"><defs>
<symbol id="i-bell" viewBox="0 0 24 24"><path d="M18 8a6 6 0 0 0-12 0c0 7-2 7-2 9h16c0-2-2-2-2-9M10 21h4M12 2V1"/></symbol>

<symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1 1M18 18l1 1M5 19l1-1M18 6l1-1"/></symbol>

<main class="app-window" id="appWindow" aria-label="Notify calendar">
  <div class="titlebar" id="titlebar">
    <span class="app-title"><svg aria-hidden="true"><use href="#i-bell"/></svg>Notify calendar</span>
    <div class="window-actions">
      <button class="window-action" id="minimize" aria-label="Minimize calendar" title="Minimize"><svg viewBox="0 0 12 12"><path d="M1 6h10"/></svg></button>
      <button class="window-action" id="maximize" aria-label="Maximize calendar" title="Maximize"><svg viewBox="0 0 12 12"><rect x="1.5" y="1.5" width="9" height="9"/></svg></button>
      <button class="window-action close" id="closeWindow" aria-label="Close calendar" title="Close (Esc)"><svg viewBox="0 0 12 12"><path d="m1 1 10 10M1 11 11 1"/></svg></button>
    </div>
  </div>
  <header class="toolbar">
    <button class="control" id="todayButton" title="Go to today (T)">Today</button>
    <div class="navigation"><button class="icon-button" id="previous" aria-label="Previous month" title="Previous period (Left)"><svg aria-hidden="true"><use href="#i-left"/></svg></button><button class="icon-button" id="next" aria-label="Next month" title="Next period (Right)"><svg aria-hidden="true"><use href="#i-right"/></svg></button></div>
    <h1 class="period-title" id="periodTitle" aria-live="polite" tabindex="-1"></h1>
    <div class="segmented view-switch" role="group" aria-label="Calendar view"><button data-view="day" aria-pressed="false" title="Day (D)">Day</button><button data-view="month" aria-pressed="true" title="Month (M)">Month</button><button data-view="year" aria-pressed="false" title="Year (Y)">Year</button></div>
    <button class="control primary new-reminder" id="newReminder"><svg aria-hidden="true"><use href="#i-plus"/></svg>New reminder</button>
  </header>
  <section class="view-host" id="viewHost" aria-label="Month calendar"></section>
  <footer class="statusbar">
    <div class="category-legend" aria-label="Reminder categories"><span class="legend-item cat-work"><i></i>Work</span><span class="legend-item cat-personal"><i></i>Personal</span><span class="legend-item cat-health"><i></i>Health</span><span class="legend-item cat-shopping"><i></i>Shopping</span><span class="legend-item cat-none"><i></i>None</span></div>
    <div class="footer-actions"><button class="theme-toggle" id="themeToggle" title="Switch to light theme"><svg aria-hidden="true"><use href="#i-sun"/></svg><span>Light theme</span></button><button class="help-button" id="helpButton" aria-label="Keyboard shortcuts" aria-expanded="false" title="Keyboard shortcuts">?</button></div>
  </footer>
  <aside class="help-popover" id="helpPopover" aria-label="Keyboard shortcuts" hidden><h2>Keyboard shortcuts</h2><div class="shortcut"><span>Previous / next period</span><kbd>в†ђ / в†’</kbd></div><div class="shortcut"><span>Go to today</span><kbd>T</kbd></div><div class="shortcut"><span>Day / month / year</span><kbd>D / M / Y</kbd></div><div class="shortcut"><span>Close dialog or calendar</span><kbd>Esc</kbd></div></aside>

<script>
"use strict";
const $=s=>document.querySelector(s), $$=s=>Array.from(document.querySelectorAll(s));

const pad=n=>String(n).padStart(2,'0');
const key=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d,12)};
const addDays=(d,n)=>new Date(d.getFullYear(),d.getMonth(),d.getDate()+n,12);
const fmt=(d,options)=>d.toLocaleDateString('en-US',options);
const fullDate=d=>fmt(d,{weekday:'long',month:'long',day:'numeric',year:'numeric'});
const weekNames=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const weekOrder=[1,2,3,4,5,6,0];
const categories=['work','personal','health','shopping','none'];
const label=s=>s[0].toUpperCase()+s.slice(1);

const timeText=n=>`${pad(Math.floor(n/60))}:${pad(n%60)}`;
const isSpecific=r=>r.repeat!=='daily'&&r.repeat!=='weekly';
let today=key(new Date());
const initialDay=parse(today), relative=n=>key(addDays(initialDay,n));
let reminders=[
 {id:1,title:'Drink a glass of water',category:'health',repeat:'daily',date:today,time:'11:00',weekdays:[]},
 {id:2,title:'Team call',category:'work',repeat:'weekly',date:today,time:'10:30',weekdays:[1,3,5]},
 {id:3,title:'Lunch break',category:'personal',repeat:'weekly',date:today,time:'13:00',weekdays:[1,2,3,4,5]},
 {id:4,title:'Buy groceries',category:'shopping',repeat:'weekly',date:today,time:'18:00',weekdays:[6]},
 {id:5,title:'Pay the bills',category:'personal',repeat:'monthly',date:`${initialDay.getFullYear()}-${pad(initialDay.getMonth()+1)}-10`,time:'09:00',weekdays:[]},
 {id:6,title:'Renew the website domain',category:'work',repeat:'yearly',date:`${initialDay.getFullYear()}-03-01`,time:'09:00',weekdays:[]},
 {id:7,title:"Anna's birthday",category:'personal',repeat:'yearly',date:`${initialDay.getFullYear()}-06-16`,time:'09:00',weekdays:[]},
 {id:8,title:"Mom's birthday",category:'personal',repeat:'yearly',date:relative(12),time:'10:00',weekdays:[]},
 {id:9,title:'Dentist appointment',category:'health',repeat:'once',date:relative(5),time:'15:30',weekdays:[]},
 {id:10,title:'Car service',category:'none',repeat:'once',date:relative(18),time:'08:30',weekdays:[]}
];
let nextId=11;
const state={view:'month',date:initialDay};
let draft=null, returnFocus=null, toastTimer=null, yearFocus=null;
function occurs(r,d){
 const anchor=parse(r.date);
 if(r.repeat==='once')return r.date===key(d);

function onDate(d){return reminders.filter(r=>occurs(r,d)).sort((a,b)=>mins(a.time)-mins(b.time)||a.id-b.id)}

 let text='';
 if(r.repeat==='once')text=fmt(parse(r.date),{month:'short',day:'numeric',year:'numeric'});
 if(r.repeat==='daily')text='Daily';
 if(r.repeat==='weekly')text=JSON.stringify([...r.weekdays].sort())===JSON.stringify([1,2,3,4,5])?'Weekdays':weekOrder.filter(d=>r.weekdays.includes(d)).map(d=>weekNames[d]).join(', ');
 if(r.repeat==='monthly')text=`Every month on the ${ordinal(parse(r.date).getDate())}`;
 if(r.repeat==='yearly')text=`Every year on ${fmt(parse(r.date),{month:'short',day:'numeric'})}`;

}
function setView(view,date=state.date){state.view=view;state.date=parse(key(date));render(true)}
function render(animate=false){
 const previousViewFocus=document.activeElement?.closest?.('#viewHost');
 hideTooltip();
 const d=state.date;
 const title=state.view==='month'?fmt(d,{month:'long',year:'numeric'}):state.view==='year'?String(d.getFullYear()):fmt(d,{weekday:'long',month:'long',day:'numeric'});
 $('#periodTitle').textContent=title;$('#periodTitle').title=title;
 $$('.view-switch button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.view===state.view));
 $('#previous').setAttribute('aria-label',`Previous ${state.view}`);$('#next').setAttribute('aria-label',`Next ${state.view}`);
 $('#viewHost').setAttribute('aria-label',`${label(state.view)} calendar, ${title}`);
 if(state.view==='month')renderMonth();else if(state.view==='day')renderDay();else renderYear();
 if(animate){$('#viewHost').classList.remove('view-enter');void $('#viewHost').offsetWidth;$('#viewHost').classList.add('view-enter')}
 if(previousViewFocus&&!document.activeElement?.closest?.('#viewHost'))$('#periodTitle').focus({preventScroll:true});
}
function eventItem(r,d){return `<button class="month-event cat-${r.category}" data-edit="${r.id}" data-date="${key(d)}" title="${esc(r.time+' '+r.title+' В· '+rule(r))}" aria-label="Edit ${esc(r.title)}, ${r.time}"><i class="event-dot"></i><time>${r.time}</time><span class="event-name">${esc(r.title)}</span></button>`}
function renderMonth(){
 const first=new Date(state.date.getFullYear(),state.date.getMonth(),1,12);
 const start=addDays(first,-((first.getDay()+6)%7));
 let cells='';
 for(let i=0;i<42;i++){
  const d=addDays(start,i), k=key(d), all=onDate(d), specific=all.filter(isSpecific), repeating=all.filter(r=>!isSpecific(r));
  const classes=['day-cell',d.getMonth()!==state.date.getMonth()?'outside':'',k<today?'past':''].join(' ');
  cells+=`<div class="${classes}" data-cell="${k}" tabindex="0" role="group" aria-label="${fullDate(d)}, ${all.length} reminders. Enter to add a reminder."><div class="date-row"><button class="date-number ${k===today?'today-number':''}" data-day="${k}" ${k===today?'aria-current="date"':''} aria-label="Open ${fullDate(d)}">${d.getDate()}</button><span class="compact-repeat" ${repeating.length?'':'hidden'} title="${repeating.length} repeating reminders">${icon('repeat')}${repeating.length}</span></div><span class="add-hint">${icon('plus')}</span><div class="month-items" data-specific="${specific.length}">${specific.map(r=>eventItem(r,d)).join('')}<button class="more-button" data-day="${k}" hidden></button></div>${repeating.length?`<button class="repeat-summary" data-day="${k}" title="${esc(repeating.map(r=>r.time+' '+r.title).join('\n'))}">${icon('repeat')}<span>${repeating.length} repeating</span></button>`:''}</div>`;
 }
 $('#viewHost').innerHTML=`<div class="month-view"><div class="weekday-row" aria-hidden="true">${['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(n=>`<span>${n}</span>`).join('')}</div><div class="month-grid">${cells}</div></div>`;
 fitMonth();
}
function fitMonth(){
 if(state.view!=='month')return;
 $$('.day-cell').forEach(cell=>{
  const specificCount=cell.querySelectorAll('.month-event').length;
  const hasRepeating=!!cell.querySelector('.repeat-summary');
  const normalCapacity=Math.max(1,Math.floor((cell.clientHeight-8-24-(hasRepeating?18:0))/18));
  const compact=cell.clientHeight<70||(hasRepeating&&specificCount>normalCapacity);
  const summary=cell.querySelector('.repeat-summary'), compactSummary=cell.querySelector('.compact-repeat');
  compactSummary.hidden=!compact||compactSummary.textContent.trim()==='0';
  if(summary)summary.hidden=compact;
  const capacity=Math.max(1,Math.floor((cell.clientHeight-8-24-(!compact&&summary?18:0))/18));
  const items=Array.from(cell.querySelectorAll('.month-event')), more=cell.querySelector('.more-button');
  const shown=items.length>capacity?Math.max(0,capacity-1):items.length;
  items.forEach((item,i)=>item.hidden=i>=shown);
  more.hidden=shown===items.length;
  more.textContent=`+${items.length-shown} more`;
 });
}
function layoutEvents(events){
 const result=[];let group=[],end=-1;
 const flush=()=>{if(!group.length)return;const columns=[];for(const r of group){let col=columns.findIndex(until=>until<=mins(r.time));if(col<0)col=columns.length;columns[col]=mins(r.time)+30;result.push({r,col,group})}group.columns=columns.length;group=[]};
 for(const r of events){if(mins(r.time)>=end){flush();end=-1}group.push(r);end=Math.max(end,mins(r.time)+30)}flush();

}
function renderDay(){
 const events=onDate(state.date);let hours='';
 for(let h=0;h<24;h++)hours+=`<span class="hour-label" style="top:${h*48}px">${pad(h)}:00</span><div class="hour-line" style="top:${h*48}px"></div><div class="hour-line half" style="top:${h*48+24}px"></div>`;
 const blocks=layoutEvents(events).map(({r,col,columns})=>`<button class="timeline-event cat-${r.category}" style="top:${mins(r.time)*.8}px;left:calc(${col*100/columns}% + 2px);width:calc(${100/columns}% - 4px)" data-edit="${r.id}" data-date="${key(state.date)}" title="${esc(r.time+' '+r.title+' В· '+label(r.category)+' В· '+rule(r))}" aria-label="Edit ${esc(r.title)}, ${rule(r)}, ${label(r.category)}"><span class="category-badge">${icon(r.category)}</span><span class="block-title">${esc(r.title)}</span><span class="block-rule">${esc(rule(r))}</span></button>`).join('');
 $('#viewHost').innerHTML=`<div class="day-view"><div class="day-summary"><span>${events.length} reminder${events.length===1?'':'s'}</span><span>Click a time to add a reminder</span></div><div class="timeline-scroll"><div class="timeline" id="timeline">${hours}<div class="event-lane">${blocks}</div><div class="ghost" id="ghost" hidden>${icon('plus')}<span></span></div><div class="now-marker" id="nowMarker" hidden><span></span></div></div></div></div>`;
 $('.timeline-scroll').scrollTop=7*48+8;
 updateNow();
}
function updateNow(){const marker=$('#nowMarker');if(!marker)return;marker.hidden=key(state.date)!==today;if(!marker.hidden){const now=new Date();marker.style.top=(now.getHours()*60+now.getMinutes())*.8+'px';marker.querySelector('span').textContent=`Now ${pad(now.getHours())}:${pad(now.getMinutes())}`}}
function renderYear(){
 let months='';const year=state.date.getFullYear();
 for(let month=0;month<12;month++){
  const first=new Date(year,month,1,12), offset=(first.getDay()+6)%7, count=new Date(year,month+1,0).getDate();
  let days=['M','T','W','T','F','S','S'].map((n,i)=>`<span class="mini-weekday" title="${['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'][i]}">${n}</span>`).join('');
  for(let i=0;i<42;i++){
   const n=i-offset+1;
   if(n<1||n>count){days+='<span></span>';continue}
   const d=new Date(year,month,n,12),k=key(d),specific=onDate(d).filter(isSpecific);
   days+=`<button class="mini-day ${k<today?'past':''} ${k===today?'today-number':''}" data-day="${k}" ${specific.length?'data-marked="true"':''} ${k===today?'aria-current="date"':''} aria-label="${fullDate(d)}${specific.length?', '+specific.map(r=>r.time+' '+esc(r.title)).join(', '):''}">${n}${specific.length?`<i class="mini-dot cat-${specific[0].category}"></i>`:''}</button>`;
  }
  months+=`<section class="mini-month" aria-label="${fmt(first,{month:'long'})}"><button class="month-name" data-month="${key(first)}">${fmt(first,{month:'long'})}</button><div class="mini-days">${days}</div></section>`;
 }
 $('#viewHost').innerHTML=`<div class="year-view"><div class="year-grid">${months}</div></div>`;
 if(yearFocus){const b=$(`[data-day="${yearFocus}"]`);if(b){b.focus({preventScroll:true});b.scrollIntoView({block:'nearest'})}yearFocus=null}
 else if(year===parse(today).getFullYear())$(`[data-day="${today}"]`)?.scrollIntoView({block:'nearest'});
}
function movePeriod(direction){
 const d=state.date;
 if(state.view==='day')state.date=addDays(d,direction);
 else if(state.view==='month'){const first=new Date(d.getFullYear(),d.getMonth()+direction,1,12);state.date=new Date(first.getFullYear(),first.getMonth(),Math.min(d.getDate(),new Date(first.getFullYear(),first.getMonth()+1,0).getDate()),12)}
 else{const y=d.getFullYear()+direction;state.date=new Date(y,d.getMonth(),Math.min(d.getDate(),new Date(y,d.getMonth()+1,0).getDate()),12)}

}
function goToday(){state.date=parse(today);if(state.view==='year')yearFocus=today;render(true)}
function showTooltip(target){
 const d=parse(target.dataset.day),items=onDate(d).filter(isSpecific),tip=$('#tooltip');if(!items.length)return;
 tip.innerHTML=`<strong>${fmt(d,{month:'long',day:'numeric'})}</strong>${items.map(r=>`<div class="tooltip-row cat-${r.category}"><i></i><span>${r.time} ${esc(r.title)}</span></div>`).join('')}`;tip.hidden=false;target.setAttribute('aria-describedby','tooltip');
 const b=target.getBoundingClientRect(),t=tip.getBoundingClientRect();tip.style.left=Math.max(8,Math.min(b.left,innerWidth-t.width-8))+'px';tip.style.top=(b.bottom+t.height+8<innerHeight?b.bottom+8:Math.max(8,b.top-t.height-8))+'px';

function hideTooltip(){$('#tooltip').hidden=true;$$('[aria-describedby="tooltip"]').forEach(e=>e.removeAttribute('aria-describedby'))}
function timelineMinute(event){const box=$('#timeline').getBoundingClientRect();return Math.max(0,Math.min(1425,Math.floor((event.clientY-box.top)/12)*15))}
$('#viewHost').addEventListener('click',e=>{
 const edit=e.target.closest('[data-edit]'),day=e.target.closest('[data-day]'),month=e.target.closest('[data-month]'),cell=e.target.closest('[data-cell]');
 if(edit){openEditor(reminders.find(r=>r.id===Number(edit.dataset.edit)),edit.dataset.date);return}
 if(day){setView('day',parse(day.dataset.day));return}
 if(month){setView('month',parse(month.dataset.month));return}

});
$('#viewHost').addEventListener('keydown',e=>{if(e.target.matches('[data-cell]')&&(e.key==='Enter'||e.key===' ')){e.preventDefault();openEditor(null,e.target.dataset.cell,'09:00')}});

 const minute=timelineMinute(e);ghost.style.top=minute*.8+'px';ghost.querySelector('span').textContent=timeText(minute);ghost.hidden=false;
});
$('#viewHost').addEventListener('pointerleave',()=>{if($('#ghost'))$('#ghost').hidden=true;hideTooltip()});

$('#viewHost').addEventListener('focusin',e=>{if(e.target.matches('[data-marked]'))showTooltip(e.target)});
$('#viewHost').addEventListener('focusout',hideTooltip);
$('#viewHost').addEventListener('scroll',hideTooltip,true);
function openEditor(reminder,date=key(state.date),time='09:00'){
 returnFocus=document.activeElement;hideTooltip();$('#helpPopover').hidden=true;$('#helpButton').setAttribute('aria-expanded','false');

 $('#editorTitle').textContent=reminder?'Edit reminder':'New reminder';$('#reminderTitle').value=draft.title;$('#reminderDate').value=draft.date;$('#reminderTime').value=draft.time;$('#formError').hidden=true;
 $('#categoryControl').innerHTML=categories.map(c=>`<button type="button" class="category-option cat-${c}" data-category="${c}" aria-pressed="${c===draft.category}">${c==='none'?'':icon(c)}${label(c)}</button>`).join('');
 $('#weekdayChoices').innerHTML=weekOrder.map(d=>`<button type="button" class="weekday-option" data-weekday="${d}" aria-pressed="${draft.weekdays.includes(d)}">${weekNames[d]}</button>`).join('');

}
function readDraft(){draft.title=$('#reminderTitle').value.trim();draft.date=$('#reminderDate').value;draft.time=$('#reminderTime').value;return draft}
function updateDraftControls(){
 $$('#repeatControl button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.repeat===draft.repeat));

 $$('#weekdayChoices button').forEach(b=>b.setAttribute('aria-pressed',draft.weekdays.includes(Number(b.dataset.weekday))));
 const hint=$('#repeatExplanation');hint.hidden=!['monthly','yearly'].includes(draft.repeat);
 if(draft.date){const d=parse(draft.date);hint.textContent=draft.repeat==='monthly'?`On the ${ordinal(d.getDate())} of each month. Months without this day are skipped.`:`On ${fmt(d,{month:'long',day:'numeric'})} each year. Dates that do not occur are skipped.`}

}
function updatePreview(){
 readDraft();const out=$('#nextPreview');
 if(!draft.date||!draft.time){out.textContent='Choose a date and time';return}
 if(draft.repeat==='weekly'&&!draft.weekdays.length){out.textContent='Choose at least one weekday';return}
 const now=new Date();let next=null;
 if(draft.repeat==='once')next=parse(draft.date);
 else for(let i=0;i<1462;i++){const d=addDays(parse(today),i);if(occurs(draft,d)){const candidate=new Date(d.getFullYear(),d.getMonth(),d.getDate(),...draft.time.split(':').map(Number));if(candidate>=now){next=d;break}}}

 const past=key(next)<today||(key(next)===today&&mins(draft.time)<now.getHours()*60+now.getMinutes());
 out.textContent=`${past?'Scheduled':'Next'}: ${fmt(next,{weekday:'short',month:'short',day:'numeric'})} at ${draft.time}${past?' (past)':''}`;
}
function closeEditor(){if(!$('#editor').open)return;$('#editor').close();draft=null;if(returnFocus?.isConnected)returnFocus.focus({preventScroll:true});else $('#newReminder').focus({preventScroll:true})}
$('#repeatControl').addEventListener('click',e=>{const b=e.target.closest('[data-repeat]');if(!b)return;readDraft();draft.repeat=b.dataset.repeat;if(draft.repeat==='weekly'&&!draft.weekdays.length)draft.weekdays=[parse(draft.date||today).getDay()];updateDraftControls()});
$('#weekdayChoices').addEventListener('click',e=>{const b=e.target.closest('[data-weekday]');if(!b)return;const d=Number(b.dataset.weekday);draft.weekdays=draft.weekdays.includes(d)?draft.weekdays.filter(v=>v!==d):[...draft.weekdays,d];updateDraftControls()});
$('#categoryControl').addEventListener('click',e=>{const b=e.target.closest('[data-category]');if(!b)return;draft.category=b.dataset.category;$$('[data-category]').forEach(x=>x.setAttribute('aria-pressed',x===b))});

$('#editorForm').addEventListener('submit',e=>{

 if(!draft.title)error='Enter a title.';else if(!draft.date||!draft.time)error='Choose a date and time.';else if(draft.repeat==='weekly'&&!draft.weekdays.length)error='Choose at least one weekday.';

$('#previous').addEventListener('click',()=>movePeriod(-1));$('#next').addEventListener('click',()=>movePeriod(1));$('#todayButton').addEventListener('click',goToday);
$$('[data-view]').forEach(b=>b.addEventListener('click',()=>setView(b.dataset.view)));
$('#newReminder').addEventListener('click',()=>openEditor(null,today,'09:00'));
$('#themeToggle').addEventListener('click',()=>{const light=document.documentElement.dataset.theme==='dark';document.documentElement.dataset.theme=light?'light':'dark';$('#themeToggle').innerHTML=icon(light?'moon':'sun')+`<span>${light?'Dark':'Light'} theme</span>`;$('#themeToggle').title=`Switch to ${light?'dark':'light'} theme`});
$('#helpButton').addEventListener('click',()=>{const p=$('#helpPopover');p.hidden=!p.hidden;$('#helpButton').setAttribute('aria-expanded',!p.hidden)});
document.addEventListener('click',e=>{if(!e.target.closest('#helpPopover,#helpButton')){$('#helpPopover').hidden=true;$('#helpButton').setAttribute('aria-expanded','false')}});
function hideWindow(minimized=false){closeEditor();hideTooltip();$('#appWindow').hidden=true;$('#closedState').hidden=false;$('#closedMessage').textContent=minimized?'Calendar minimized':'Calendar closed';$('#reopen').focus()}
function maximize(){const isMax=$('#appWindow').classList.toggle('maximized');$('#maximize').title=isMax?'Restore':'Maximize';$('#maximize').setAttribute('aria-label',`${isMax?'Restore':'Maximize'} calendar`);$('#maximize').innerHTML=isMax?'<svg viewBox="0 0 12 12"><path d="M4 3V1h7v7H9"/><rect x="1" y="4" width="7" height="7"/></svg>':'<svg viewBox="0 0 12 12"><rect x="1.5" y="1.5" width="9" height="9"/></svg>';fitMonth()}
$('#closeWindow').addEventListener('click',()=>hideWindow());$('#minimize').addEventListener('click',()=>hideWindow(true));$('#maximize').addEventListener('click',maximize);$('#titlebar').addEventListener('dblclick',e=>{if(!e.target.closest('button'))maximize()});
$('#reopen').addEventListener('click',()=>{$('#closedState').hidden=true;$('#appWindow').hidden=false;state.date=parse(today);state.view='month';render(true);$('#todayButton').focus()});
document.addEventListener('keydown',e=>{
 if($('#editor').open)return;
 if(e.key==='Escape'){e.preventDefault();if(!$('#helpPopover').hidden){$('#helpPopover').hidden=true;$('#helpButton').setAttribute('aria-expanded','false');$('#helpButton').focus()}else if(!$('#appWindow').hidden)hideWindow();return}
 if($('#appWindow').hidden||e.ctrlKey||e.metaKey||e.altKey||e.target.closest('input,textarea,select,[contenteditable="true"]'))return;
 const k=e.key.toLowerCase();if(['arrowleft','arrowright','t','d','m','y'].includes(k))e.preventDefault();
 if(k==='arrowleft')movePeriod(-1);if(k==='arrowright')movePeriod(1);if(k==='t')goToday();if(k==='d')setView('day');if(k==='m')setView('month');if(k==='y')setView('year');
});
new ResizeObserver(()=>{fitMonth();hideTooltip()}).observe($('#viewHost'));
setInterval(()=>{const nextToday=key(new Date());if(nextToday!==today){today=nextToday;render()}else updateNow()},30000);
render();
</script>
</body>
</html>
